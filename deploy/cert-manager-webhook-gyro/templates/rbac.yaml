apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager-webhook-gyro.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "cert-manager-webhook-gyro.name" . }}
    chart: {{ include "cert-manager-webhook-gyro.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
---
# Grant the webhook permission to read the ConfigMap containing the Kubernetes
# apiserver's requestheader-ca-certificate.
# This ConfigMap is automatically created by the Kubernetes apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-gyro.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    app: {{ include "cert-manager-webhook-gyro.name" . }}
    chart: {{ include "cert-manager-webhook-gyro.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-gyro.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# apiserver gets the auth-delegator role to delegate auth decisions to
# the core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-gyro.fullname" . }}:auth-delegator
  labels:
    app: {{ include "cert-manager-webhook-gyro.name" . }}
    chart: {{ include "cert-manager-webhook-gyro.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-gyro.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Grant cert-manager permission to validate using our apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-gyro.fullname" . }}:domain-solver
  labels:
    app: {{ include "cert-manager-webhook-gyro.name" . }}
    chart: {{ include "cert-manager-webhook-gyro.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - '*'
    verbs:
      - 'create'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-gyro.fullname" . }}:domain-solver
  labels:
    app: {{ include "cert-manager-webhook-gyro.name" . }}
    chart: {{ include "cert-manager-webhook-gyro.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-gyro.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
---
# Read the ACME key Secret only in the listed namespaces (Issuer namespaces; for a ClusterIssuer: cert-manager's namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-gyro.fullname" . }}:secret-reader
  labels:
    app: {{ include "cert-manager-webhook-gyro.name" . }}
    chart: {{ include "cert-manager-webhook-gyro.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
{{- $root := . }}
{{- range $ns := (default (list $.Values.certManager.namespace $.Release.Namespace) .Values.secretNamespaces) | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-gyro.fullname" $root }}:secret-reader
  namespace: {{ $ns }}
  labels:
    app: {{ include "cert-manager-webhook-gyro.name" $root }}
    release: {{ $root.Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-gyro.fullname" $root }}:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-gyro.fullname" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
